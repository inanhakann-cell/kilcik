<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06131a">
<title>KILÇIK — QR ile kur</title>
<link rel="icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#06131a;color:#e6f1f4;font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;overflow-wrap:break-word}
main{max-width:440px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
h1{margin:8px 0;font-size:1.6rem}p{margin:8px 0}.mute{color:#9db5bf;font-size:.9rem}
.qr{display:block;width:min(100%,360px,62vh);height:auto;margin:12px auto;border-radius:16px;background:#fff}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;margin:10px 0;padding:10px 16px;border-radius:14px;border:1px solid #1d3a46;background:#12303b;color:#e6f1f4;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn.primary{background:#14b8a6;border-color:#14b8a6;color:#042f2e}
section{background:#0d2029;border:1px solid #1d3a46;border-radius:16px;padding:6px 16px;margin:14px 0;text-align:left}
</style>
</head>
<body>
<main>
<h1>KILÇIK’ı kur</h1>
<p>Telefonun <b>kamerasını</b> bu kareye tut, çıkan bağlantıya dokun.</p>
<img class="qr" src="qr.svg" width="360" height="360" alt="KILÇIK kurulum sayfasının karekodu">
<section><p><b>iPhone:</b> Safari’de açılır → Paylaş → <b>Ana Ekrana Ekle</b>.</p><p><b>Android:</b> Chrome’da açılır → <b>Telefona yükle</b>.</p></section>
<button type="button" class="btn primary" id="send">Bağlantıyı gönder</button>
<a class="btn" href="./">← Uygulamaya dön</a>
<p class="mute">Ücretsiz · üyelik yok · mağazadan indirme yok</p>
</main>
<script src="js/qr.js"></script>
</body>
</html>
